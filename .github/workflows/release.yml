name: Release

# A tag `vX.Y.Z` builds `NEXUL-Setup.exe` on Windows and publishes the release of that
# version, its notes taken from the section of CHANGELOG.md. On a pull request that
# changes this workflow, the installer or its scripts, the same build runs without publishing
# (the installer is kept as an artifact). Started by hand on `main` with a version, it
# creates the tag `v<version>` on that commit and publishes the same way (for a session
# that cannot push tags).
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (as in CHANGELOG.md and Cargo.toml, e.g. 0.3.0)"
        required: true
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/build_installer.py"
      - "tools/make-python-runtime.py"
      - "tools/release_notes.py"
      - "installer/**"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Install LLVM 20.1.8 (C API, LLD, LLDB)
      shell: pwsh
      run: |
        $ProgressPreference = 'SilentlyContinue'
        $archive = Join-Path $env:RUNNER_TEMP 'llvm-20.1.8.tar.xz'
        $llvm = Join-Path $env:RUNNER_TEMP 'llvm'
        Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/clang+llvm-20.1.8-x86_64-pc-windows-msvc.tar.xz' -OutFile $archive
        $expected = 'f229769f11d6a6edc8ada599c0cda964b7dee6ab1a08c6cf9dd7f513e85b107f'
        if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'LLVM archive checksum mismatch' }
        New-Item -ItemType Directory -Force $llvm | Out-Null
        & "$env:WINDIR/System32/tar.exe" -xf $archive -C $llvm --strip-components 1
        if ($LASTEXITCODE -ne 0) { throw 'LLVM archive extraction failed' }
        Remove-Item $archive
        foreach ($file in @("LLVM-C.dll", "lld.exe", "lldb-dap.exe", "liblldb.dll", "lldb-server.exe", "lldb-argdumper.exe")) {
          if (!(Test-Path (Join-Path $llvm "bin/$file"))) { throw "LLVM file missing: $file" }
        }
        "NEXUL_LLVM=$llvm" >> $env:GITHUB_ENV
        "$llvm/bin" >> $env:GITHUB_PATH
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Point the debugger at this Python
      shell: pwsh
      run: |
        "NEXUL_PYTHON=$env:pythonLocation" >> $env:GITHUB_ENV
    - name: Build NEXUL-Setup.exe
      shell: pwsh
      run: |
        python -I tools/build_installer.py "$env:RUNNER_TEMP/NEXUL-Setup.exe"
        if ($LASTEXITCODE -ne 0) { throw 'installer build failed' }
    - name: Check the installer in a sandbox
      run: cargo test --release --manifest-path installer/Cargo.toml --features test-sandbox --test silent --bins
    - uses: actions/upload-artifact@v4
      with:
        name: NEXUL-Setup
        path: ${{ runner.temp }}/NEXUL-Setup.exe
    - name: Publish the release
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          if ("${{ github.ref }}" -ne "refs/heads/main") { throw 'a version is published from main only' }
          $version = $env:INPUT_VERSION.Trim().TrimStart('v')
          $tag = "v$version"
          # The version of the workspace must be the one published.
          if (-not (Select-String -Path Cargo.toml -Pattern "^version = `"$([regex]::Escape($version))`"" -Quiet)) { throw "Cargo.toml is not at version $version" }
          $create = @('--target', "${{ github.sha }}")
        } else {
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $create = @('--verify-tag')
        }
        # The notes and the title, from the section of the version in CHANGELOG.md.
        python -I tools/release_notes.py $version notes.md title.txt
        if ($LASTEXITCODE -ne 0) { throw "no notes for $version" }
        $title = Get-Content -Path title.txt -Raw -Encoding utf8
        Copy-Item "$env:RUNNER_TEMP/NEXUL-Setup.exe" NEXUL-Setup.exe
        gh release create $tag NEXUL-Setup.exe --title "$title" --notes-file notes.md @create
        if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
