name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build and test portable crates
    runs-on: ubuntu-latest
    env:
      NEXUL_LLVM: /usr/lib/llvm-19
    steps:
      - uses: actions/checkout@v4
      - name: Install the LLVM version required by generated debug records
        run: sudo apt-get update && sudo apt-get install --yes llvm-19-dev lld-19
      - name: Build
        run: cargo build --verbose --workspace --exclude nexul-installer
      - name: Run tests
        run: cargo test --verbose --workspace --exclude nexul-installer

  installer-windows:
    name: Test Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run installer tests in a sandbox
        run: cargo test --verbose --manifest-path installer/Cargo.toml --features test-sandbox --test silent --bins
